<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物防衛軍 6.0：森林家園守護戰</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --green: #2ecc71;
            --red: #ff4757;
            --gold: #ffa502;
            --sky: #70a1ff;
            --glass: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none;
        }

        #main-container { display: flex; gap: 40px; align-items: center; }

        /* 左側遊戲區 */
        #game-wrapper { display: flex; flex-direction: column; align-items: center; }
        
        #ui-header {
            width: 420px; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; background: var(--glass); padding: 15px; border-radius: 20px;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-value { font-size: 38px; font-weight: 900; font-family: 'Arial Black', sans-serif; line-height: 1; }
        
        #progress-container {
            width: 420px; height: 12px; background: #333; border-radius: 6px; margin-bottom: 10px; overflow: hidden;
        }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--sky), var(--green)); transition: 0.3s; }

        #game-area {
            position: relative; width: 400px; height: 500px;
            border: 8px solid #2f3542; border-radius: 30px; background: #000;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }

        /* 右側進化房子 */
        #side-panel {
            width: 260px; height: 550px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            background: linear-gradient(180deg, #2f3542 0%, #1e272e 100%);
            border-radius: 40px; border: 4px solid #57606f; padding: 30px 20px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
        }
        .house-container {
            position: relative; width: 100%; height: 200px; display: flex; align-items: center; justify-content: center;
        }
        .house-visual { 
            font-size: 140px; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            filter: drop-shadow(0 0 20px rgba(46,204,113,0.3));
        }
        .house-glow {
            position: absolute; width: 180px; height: 180px; border-radius: 50%;
            background: var(--green); filter: blur(50px); opacity: 0.2; transition: 0.5s;
        }
        .garden-area { font-size: 40px; min-height: 100px; text-align: center; line-height: 1.5; }

        /* 下方選擇器 */
        #selector { display: flex; gap: 10px; margin-top: 25px; width: 440px; }
        .slot {
            flex: 1; padding: 15px 5px; background: #3d3d3d; border: 4px solid #555;
            border-radius: 20px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .slot.active { 
            border-color: var(--green); background: #1a3324; transform: translateY(-12px);
            box-shadow: 0 15px 30px rgba(46,204,113,0.4); 
        }
        .slot span { display: block; font-size: 32px; }
        .slot label { font-size: 12px; font-weight: bold; color: #ccc; }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100; text-align: center;
            border-radius: 22px; padding: 20px;
        }
        .btn-start {
            background: var(--green); color: white; border: none; padding: 20px 80px;
            font-size: 1.8em; border-radius: 100px; cursor: pointer; font-weight: bold;
            box-shadow: 0 8px 0 #218c74; transition: 0.1s;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #218c74; }

        .dmg-flash { animation: flash 0.3s; }
        @keyframes flash { 0% { background: rgba(255, 71, 87, 0.6); } 100% { background: transparent; } }
    </style>
</head>
<body>

<div id="main-container">
    <div id="game-wrapper">
        <div id="ui-header">
            <div><div style="font-size:14px;color:#aaa">🏠 家園健康</div><div class="stat-value" id="hp-txt" style="color:var(--green)">200</div></div>
            <div style="text-align:right"><div style="font-size:14px;color:#aaa">✨ 淨化進度</div><div class="stat-value" id="score-txt" style="color:var(--gold)">0</div></div>
        </div>
        <div id="progress-container"><div id="progress-bar"></div></div>

        <div id="game-area">
            <canvas id="c"></canvas>
            <div id="overlay">
                <h1 id="m-title" style="color:var(--green); font-size: 3.5em; margin: 0;">植物防衛軍</h1>
                <p id="m-desc" style="color:#aaa; font-size: 1.2em; margin: 20px 0 40px 0;">守護環境到 3000 分即可獲勝！</p>
                <button class="btn-start" onclick="init()">出發守護</button>
            </div>
        </div>

        <div id="selector">
            <div class="slot active" onclick="setP(0)"><span>🐍</span><label>虎尾蘭</label></div>
            <div class="slot" onclick="setP(1)"><span>🕸️</span><label>吊蘭</label></div>
            <div class="slot" onclick="setP(2)"><span>🍀</span><label>常春藤</label></div>
            <div class="slot" onclick="setP(3)"><span>🌿</span><label>腎蕨</label></div>
            <div class="slot" onclick="setP(4)"><span>🌱</span><label>黃金葛</label></div>
        </div>
    </div>

    <div id="side-panel">
        <h2 style="margin: 0; color: var(--sky);">我的森林家園</h2>
        <div class="house-container">
            <div id="glow" class="house-glow"></div>
            <div id="house" class="house-visual">🏠</div>
        </div>
        <div id="garden" class="garden-area"></div>
        <div id="status-tag" style="background: var(--green); padding: 10px 30px; border-radius: 50px; font-weight: bold;">空氣超清新</div>
        <p style="font-size: 12px; color: #777;">等級越高，家園越漂亮！</p>
    </div>
</div>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const area = document.getElementById('game-area');
    const houseEl = document.getElementById('house');
    const glowEl = document.getElementById('glow');
    const gardenEl = document.getElementById('garden');
    const scoreBar = document.getElementById('progress-bar');
    
    canvas.width = 400; canvas.height = 500;

    const plants = [
        { emo: "🐍", tags: ["甲醛", "油漆", "地毯", "家具", "深夜CO2"] },
        { emo: "🕸️", tags: ["甲醛"] },
        { emo: "🍀", tags: ["甲醛", "皮味", "香水", "香薰", "黏著劑"] },
        { emo: "🌿", tags: ["燒香", "拜拜", "煙霧", "異味", "油煙", "精油"] },
        { emo: "🌱", tags: ["高峰CO2", "悶熱", "人多", "低光", "穩定淨化"] }
    ];

    const pool = [
        { t: "油漆臭味", type: "甲醛", hint: "🐍🍀🕸️" },
        { t: "客廳燒香", type: "燒香", hint: "🌿" },
        { t: "睡覺悶氣", type: "深夜CO2", hint: "🐍" },
        { t: "好多人喔", type: "高峰CO2", hint: "🌱" },
        { t: "新買的桌子", type: "甲醛", hint: "🐍🍀🕸️" },
        { t: "香水噴太多", type: "香水", hint: "🍀" },
        { t: "媽媽炒菜煙", type: "油煙", hint: "🌿" },
        { t: "新地毯味道", type: "黏著劑", hint: "🐍🍀" },
        { t: "蚊香的味道", type: "煙霧", hint: "🌿" },
        { t: "新皮包味道", type: "皮味", hint: "🍀" },
        { t: "廁所芳香劑", type: "精油", hint: "🌿" }
    ];

    let hp = 200, score = 0, curP = 0, pX = 175, state = 'OFF';
    let currentTask = null;
    let floaters = [], rafId = null;

    // 控制
    window.addEventListener('keydown', e => {
        if(e.key >= '1' && e.key <= '5') setP(e.key - 1);
        if(e.key === 'ArrowLeft') pX = Math.max(0, pX - 60);
        if(e.key === 'ArrowRight') pX = Math.min(canvas.width - 60, pX + 60);
    });

    canvas.addEventListener('mousemove', e => {
        const r = canvas.getBoundingClientRect();
        pX = Math.min(Math.max(0, e.clientX - r.left - 30), canvas.width - 60);
    });

    function setP(i) {
        curP = i;
        document.querySelectorAll('.slot').forEach((s, idx) => s.classList.toggle('active', idx === i));
    }

    function init() {
        hp = 200; score = 0; state = 'ON';
        currentTask = null; floaters = [];
        document.getElementById('overlay').style.display = 'none';
        if(rafId) cancelAnimationFrame(rafId);
        update();
    }

    function spawnNext() {
        const item = pool[Math.floor(Math.random() * pool.length)];
        currentTask = {
            x: Math.random() * 240 + 80, y: -80,
            txt: item.t, type: item.type, hint: item.hint,
            speed: 1.5 + (score / 2000)
        };
    }

    function update() {
        if(state !== 'ON') return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 背景微光
        ctx.fillStyle = "#050505"; ctx.fillRect(0,0,400,500);

        if (!currentTask) spawnNext();

        // 玩家
        ctx.font = "55px Arial";
        ctx.fillText(plants[curP].emo, pX + 2, canvas.height - 35);
        ctx.fillStyle = varColor('--green');
        ctx.fillRect(pX, canvas.height - 20, 60, 12);

        // 題目與圖示 (解決重疊的核心代碼)
        if (currentTask) {
            currentTask.y += currentTask.speed;

            // 1. 繪製文字底框 (防止跟圓球重疊)
            const boxW = 140, boxH = 40;
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.beginPath();
            ctx.roundRect(currentTask.x - boxW/2, currentTask.y - 75, boxW, boxH, 10);
            ctx.fill();

            // 2. 繪製題目文字
            ctx.fillStyle = "#000";
            ctx.font = "bold 20px 'Microsoft JhengHei'";
            ctx.textAlign = "center";
            ctx.fillText(currentTask.txt, currentTask.x, currentTask.y - 48);

            // 3. 繪製污染物圖示 (圓球) 在文字下方
            ctx.fillStyle = varColor('--red');
            ctx.beginPath(); ctx.arc(currentTask.x, currentTask.y - 15, 12, 0, Math.PI*2); ctx.fill();

            // 4. 繪製提示 (在圓球下方)
            ctx.fillStyle = varColor('--sky');
            ctx.font = "bold 18px Arial";
            ctx.fillText("💡提示: " + currentTask.hint, currentTask.x, currentTask.y + 20);

            // 碰撞檢測
            if (currentTask.y > canvas.height - 85 && currentTask.x > pX - 30 && currentTask.x < pX + 90) {
                if (plants[curP].tags.includes(currentTask.type)) {
                    score += 100;
                    addFloater(currentTask.x, currentTask.y, "✨ 成功淨化!", varColor('--green'));
                } else {
                    hp -= 25; flashRed();
                    addFloater(currentTask.x, currentTask.y, "❌ 選錯植物了!", varColor('--red'));
                }
                currentTask = null;
            } else if (currentTask.y > canvas.height + 50) {
                hp -= 15; flashRed();
                currentTask = null;
            }
        }

        // 浮動文字
        for(let i=floaters.length-1; i>=0; i--) {
            let f = floaters[i];
            f.y -= 1.5; f.life -= 0.02;
            ctx.font = "bold 24px 'Microsoft JhengHei'";
            ctx.fillStyle = `rgba(${f.c}, ${f.life})`;
            ctx.fillText(f.t, f.x, f.y);
            if(f.life <= 0) floaters.splice(i,1);
        }

        updateUI();

        // 破關與失敗判斷
        if(hp <= 0) {
            endGame("⛽ 需要再加油！", "空氣變得很糟糕，我們再試一次吧！", varColor('--red'));
        } else if(score >= 3000) {
            endGame("🏆 守護大成功！", "恭喜你！你創造了完美的森林家園！", varColor('--green'));
        } else {
            rafId = requestAnimationFrame(update);
        }
    }

    function updateUI() {
        document.getElementById('hp-txt').innerText = hp;
        document.getElementById('score-txt').innerText = score;
        
        // 進度條
        const progress = (score / 3000) * 100;
        scoreBar.style.width = `${progress}%`;

        // 房子視覺升級
        const level = Math.floor(score / 500);
        const houseTypes = ["🏠", "🏡", "🏘️", "🏩", "🏢", "🏰", "👑"];
        houseEl.innerText = houseTypes[Math.min(level, 6)];
        
        // 燈光與灰度控制
        const isBad = hp < 80;
        glowEl.style.background = isBad ? varColor('--red') : varColor('--green');
        glowEl.style.opacity = 0.1 + (hp/200)*0.4;
        houseEl.style.filter = `grayscale(${100 - (hp/2)}) brightness(${50 + (hp/4)}%)`;

        // 花園裝飾
        let deco = "";
        const decoCount = Math.floor(score / 300);
        const items = ["🌻", "🌳", "🌸", "🦋", "🌷", "🌲", "🍀", "🐦"];
        for(let i=0; i<decoCount; i++) deco += items[i % items.length];
        gardenEl.innerText = deco;
    }

    function addFloater(x, y, t, colorHex) {
        let r = parseInt(colorHex.slice(1,3), 16);
        let g = parseInt(colorHex.slice(3,5), 16);
        let b = parseInt(colorHex.slice(5,7), 16);
        floaters.push({ x, y, t, c: `${r},${g},${b}`, life: 1 });
    }

    function flashRed() {
        area.classList.remove('dmg-flash');
        void area.offsetWidth;
        area.classList.add('dmg-flash');
    }

    function endGame(title, desc, color) {
        state = 'OFF';
        document.getElementById('overlay').style.display = 'flex';
        const titleEl = document.getElementById('m-title');
        titleEl.innerText = title;
        titleEl.style.color = color;
        document.getElementById('m-desc').innerText = desc + `\n最終積分：${score}`;
    }

    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
</script>

</body>
</html>
