<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物光週期大挑戰：打造清新實驗室</title>
    <style>
        :root {
            --green: #2d6a4f;
            --light-green: #d8f3dc;
            --red: #c9184a;
            --yellow: #ffb703;
            --sky-blue: #ade8f4;
        }
        body {
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
            background: #e0f2f1;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        #game-wrapper {
            width: 480px; background: white; padding: 30px; border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); text-align: center;
            border: 6px solid var(--green); position: relative;
        }
        /* 標題樣式 */
        h1 { color: var(--green); margin-top: 0; font-size: 24px; }
        
        /* 數值欄位 */
        .stats { display: flex; justify-content: space-between; font-weight: 800; color: var(--green); margin-bottom: 15px; font-size: 18px; }
        .hp-bg { width: 100%; height: 28px; background: #eee; border-radius: 14px; overflow: hidden; margin-bottom: 25px; border: 2px solid #ccc; }
        #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #52b788, #2d6a4f); transition: width 0.3s; }
        
        /* 題目卡片 */
        #scene-card {
            background: var(--light-green); padding: 25px; border-radius: 25px;
            min-height: 220px; margin-bottom: 25px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; border: 3px dashed var(--green);
        }
        #icon { font-size: 60px; margin-bottom: 15px; }
        #text { font-size: 20px; color: #1b4332; line-height: 1.5; font-weight: bold; }
        
        /* 提示區域 */
        #hint-box { color: #555; font-size: 16px; margin-bottom: 10px; font-style: italic; visibility: hidden; }

        /* 按鈕樣式 */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn {
            background: white; border: 3px solid var(--green); padding: 12px;
            border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 17px;
            transition: all 0.2s; color: var(--green);
        }
        .btn:hover { background: var(--green); color: white; transform: translateY(-3px); }
        .btn:active { transform: translateY(0); }
        .hint-btn {
            background: var(--yellow); border: none; padding: 8px 15px; border-radius: 10px;
            margin-bottom: 10px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <h1>🌿 植物超人：光週期挑戰 🌿</h1>
    <div class="stats">
        <span>🏆 積分：<span id="score-txt">0</span></span>
        <span>📅 第 <span id="day-txt">1</span> / 10 天</span>
    </div>
    
    <div class="hp-bg"><div id="hp-bar"></div></div>
    
    <button class="hint-btn" onclick="showHint()">💡 需要提示嗎？</button>
    <div id="hint-box">提示：答案的第一個字是「<span id="hint-char">?</span>」</div>

    <div id="scene-card">
        <div id="icon">🌱</div>
        <div id="text">準備好了嗎？點擊下方開始保護環境！</div>
    </div>

    <div class="btn-group" id="choices">
        <button class="btn" onclick="startGame()">開始遊戲</button>
    </div>
</div>

<script>
    let score = 0;
    let day = 1;
    let health = 100;
    let currentQ = null;
    let isPlaying = false;
    let gameLoop;

    // 題目資料庫 (根據光週期作品說明書)
    const questions = [
        { q: "什麼是「光週期」呢？", a: ["晝夜光照比例", "植物的高矮", "澆水的次數", "泥土的顏色"], correct: 0, icon: "⏰" },
        { q: "常春藤在什麼時候氣孔會關閉，停止吸收二氧化碳？", a: ["暗期(晚上)", "光期(白天)", "中午", "早上"], correct: 0, icon: "🌙" },
        { q: "哪種植物具備 CAM 特性，適合在晚上幫忙淨化臥室空氣？", a: ["虎尾蘭", "黃金葛", "波士頓蕨", "吊蘭"], correct: 0, icon: "🐍" },
        { q: "CAM 植物（如虎尾蘭）在晚上會打開什麼來吸收二氧化碳？", a: ["氣孔", "花瓣", "根部", "果實"], correct: 0, icon: "🍃" },
        { q: "大多數植物在哪個時期移除污染物的效率最高？", a: ["光期(白天)", "暗期(晚上)", "半夜", "清晨"], correct: 0, icon: "☀️" },
        { q: "穩定的「光週期」可以幫助植物維持什麼健康？", a: ["生物量(重量)", "葉子的顏色", "根的長度", "花朵的香味"], correct: 0, icon: "⚖️" },
        { q: "波士頓蕨透過什麼作用，可以帶動空氣對流來清除灰塵？", a: ["蒸散作用", "呼吸作用", "消化作用", "冬眠"], correct: 0, icon: "💧" },
        { q: "光合作用是將二氧化碳轉化成什麼儲存起來？", a: ["有機碳", "氧氣氣泡", "小石頭", "水滴"], correct: 0, icon: "🍬" },
        { q: "虎尾蘭在晚上吸收二氧化碳後，會先儲存為什麼酸？", a: ["蘋果酸", "檸檬酸", "草莓酸", "葡萄酸"], correct: 0, icon: "🍎" },
        { q: "植物淨化空氣是一套什麼樣的調節系統？", a: ["動態調節", "靜止不動", "純化學", "全自動機械"], correct: 0, icon: "🔄" }
    ];

    function startGame() {
        score = 0;
        day = 1;
        health = 100;
        isPlaying = true;
        updateUI();
        nextQuestion();
        // 放慢計時速度：每 200 毫秒扣 1% (原本可能是 100ms)
        gameLoop = setInterval(() => {
            if (isPlaying) {
                health -= 1;
                if (health <= 0) gameOver();
                updateUI();
            }
        }, 200); 
    }

    function nextQuestion() {
        if (day > 10) {
            win();
            return;
        }
        currentQ = questions[day - 1];
        document.getElementById('icon').innerText = currentQ.icon;
        document.getElementById('text').innerText = currentQ.q;
        document.getElementById('hint-box').style.visibility = "hidden";
        
        const choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = '';
        
        // 隨機打亂選項
        let opts = currentQ.a.map((t, i) => ({t, i}));
        opts.sort(() => Math.random() - 0.5);

        opts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt.t;
            btn.onclick = () => checkAnswer(opt.i);
            choicesDiv.appendChild(btn);
        });
    }

    function showHint() {
        const correctText = currentQ.a[currentQ.correct];
        document.getElementById('hint-char').innerText = correctText[0];
        document.getElementById('hint-box').style.visibility = "visible";
    }

    function checkAnswer(idx) {
        if (idx === currentQ.correct) {
            score += 100; // 答對加 100 分
            day += 1;     // 答對加一天
            health = Math.min(100, health + 20); // 獎勵一點時間
            if (day > 10) {
                win();
            } else {
                nextQuestion();
            }
        } else {
            health -= 25; // 答錯扣時間
            alert("哎呀！選錯了，環境變髒了！");
        }
        updateUI();
    }

    function updateUI() {
        document.getElementById('hp-bar').style.width = health + "%";
        document.getElementById('score-txt').innerText = score;
        document.getElementById('day-txt').innerText = Math.min(day, 10);
        if (health < 30) document.getElementById('hp-bar').style.background = "var(--red)";
        else document.getElementById('hp-bar').style.background = "linear-gradient(90deg, #52b788, #2d6a4f)";
    }

    function gameOver() {
        clearInterval(gameLoop);
        isPlaying = false;
        document.getElementById('scene-card').style.background = "#ffd7d7";
        document.getElementById('icon').innerText = "😷";
        document.getElementById('text').innerHTML = `<b style='color:red'>環境污染太嚴重了！</b><br>你在第 ${day} 天失敗了...<br>再試一次，成為植物專家！`;
        document.getElementById('choices').innerHTML = `<button class="btn" onclick="location.reload()">重新挑戰</button>`;
    }

    function win() {
        clearInterval(gameLoop);
        isPlaying = false;
        document.getElementById('scene-card').style.background = "var(--sky-blue)";
        document.getElementById('icon').innerText = "🏆";
        document.getElementById('text').innerHTML = `<b style='color:blue'>恭喜破關！</b><br>你成功利用光週期知識拯救了實驗室！<br>最終積分：${score}`;
        document.getElementById('choices').innerHTML = `<button class="btn" onclick="location.reload()">再玩一次</button>`;
    }
</script>
</body>
</html>
